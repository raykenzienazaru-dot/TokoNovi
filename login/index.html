<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Masuk - Ecommers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="page-auth">
    <section class="auth-card" aria-label="Form masuk Ecommers">
      <div class="auth-brand">
        <svg class="brand-cart" viewBox="0 0 128 92" aria-hidden="true">
          <path d="M7 35h25" />
          <path d="M18 20h29" />
          <path d="M0 50h38" />
          <path d="M43 5h16c4 0 7 3 8 7l4 13" />
          <path class="cart-body" d="M66 25h47c6 0 10 5 9 11l-7 28c-1 5-5 8-10 8H62c-6 0-10-4-12-10l-10-37h26Z" />
          <circle cx="64" cy="82" r="8" />
          <circle cx="107" cy="82" r="8" />
        </svg>
        <h1>Ecommers</h1>
        <p>Belanja mudah, kapan saja dan di mana saja</p>
      </div>

      <div class="auth-heading">
        <h2>Masuk ke Akun Anda</h2>
        <p>Silakan masuk untuk melanjutkan</p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label class="auth-label" for="email-input">Email</label>
          <div class="auth-input-wrap">
            <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16v12H4z" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <input type="email" class="auth-input" id="email-input" placeholder="Masukkan email Anda" autocomplete="email" autofocus/>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password-input">Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              <path d="M12 14v3" />
            </svg>
            <input type="password" class="auth-input" id="password-input" placeholder="Masukkan password Anda" autocomplete="current-password"/>
            <button class="password-toggle" type="button" id="password-toggle" aria-label="Tampilkan password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <p class="auth-error" id="login-error" role="alert"></p>
        </div>

        <a class="forgot-link" href="#">Lupa password?</a>
        <button type="submit" class="auth-submit" id="login-btn">Masuk</button>
      </form>

      <div class="auth-divider">
        <span></span>
        <p>atau masuk dengan</p>
        <span></span>
      </div>

      <button class="google-button" type="button" id="google-login">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.24 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.94l3.66-2.84Z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.31 9.14 5.38 12 5.38Z"/>
        </svg>
        <span>Lanjutkan dengan Google</span>
      </button>

      <p class="signup-copy">Belum punya akun? <a href="#">Daftar sekarang</a></p>
    </section>
  </main>

  <script src="../supabase-config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
