<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Masuk / Daftar - Ecommers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="page-auth">
    <section class="auth-card" aria-label="Form autentikasi Ecommers">

      <!-- Brand -->
      <div class="auth-brand">
        <svg class="brand-cart" viewBox="0 0 128 92" aria-hidden="true">
          <path d="M7 35h25" />
          <path d="M18 20h29" />
          <path d="M0 50h38" />
          <path d="M43 5h16c4 0 7 3 8 7l4 13" />
          <path class="cart-body" d="M66 25h47c6 0 10 5 9 11l-7 28c-1 5-5 8-10 8H62c-6 0-10-4-12-10l-10-37h26Z" />
          <circle cx="64" cy="82" r="8" />
          <circle cx="107" cy="82" r="8" />
        </svg>
        <h1>Ecommers</h1>
        <p>Belanja mudah, kapan saja dan di mana saja</p>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Masuk</button>
        <button class="auth-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register">Daftar</button>
        <span class="auth-tab-indicator" id="tab-indicator"></span>
      </div>

      <!-- ===== LOGIN PANEL ===== -->
      <div class="auth-panel active" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="auth-heading">
          <h2>Masuk ke Akun Anda</h2>
          <p>Silakan masuk untuk melanjutkan</p>
        </div>

        <form class="auth-form" id="login-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="email-input">Email</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16v12H4z" />
                <path d="m4 7 8 6 8-6" />
              </svg>
              <input type="email" class="auth-input" id="email-input" placeholder="Masukkan email Anda" autocomplete="email" autofocus/>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="password-input">Password</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                <path d="M12 14v3" />
              </svg>
              <input type="password" class="auth-input" id="password-input" placeholder="Masukkan password Anda" autocomplete="current-password"/>
              <button class="password-toggle" type="button" id="password-toggle" aria-label="Tampilkan password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <p class="auth-error" id="login-error" role="alert"></p>
          </div>

          <a class="forgot-link" href="#">Lupa password?</a>
          <button type="submit" class="auth-submit" id="login-btn">Masuk</button>
        </form>



        <p class="auth-switch-copy">Belum punya akun? <button type="button" class="auth-switch-btn" id="go-to-register">Daftar sekarang</button></p>
      </div>

      <!-- ===== REGISTER PANEL ===== -->
      <div class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register">
        <div class="auth-heading">
          <h2>Buat Akun Baru</h2>
          <p>Isi data di bawah untuk mendaftar</p>
        </div>

        <form class="auth-form" id="register-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="reg-name-input">Nama Lengkap</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <input type="text" class="auth-input" id="reg-name-input" placeholder="Masukkan nama lengkap Anda" autocomplete="name"/>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-email-input">Email</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16v12H4z" />
                <path d="m4 7 8 6 8-6" />
              </svg>
              <input type="email" class="auth-input" id="reg-email-input" placeholder="Masukkan email Anda" autocomplete="email"/>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-password-input">Password</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                <path d="M12 14v3" />
              </svg>
              <input type="password" class="auth-input" id="reg-password-input" placeholder="Buat password (min. 6 karakter)" autocomplete="new-password"/>
              <button class="password-toggle" type="button" id="reg-password-toggle" aria-label="Tampilkan password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-confirm-input">Konfirmasi Password</label>
            <div class="auth-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                <path d="M12 14v3" />
              </svg>
              <input type="password" class="auth-input" id="reg-confirm-input" placeholder="Ulangi password Anda" autocomplete="new-password"/>
              <button class="password-toggle" type="button" id="reg-confirm-toggle" aria-label="Tampilkan password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <p class="auth-error" id="register-error" role="alert"></p>
          </div>

          <button type="submit" class="auth-submit" id="register-btn" style="margin-top:8px">Daftar</button>
        </form>

        <p class="auth-switch-copy">Sudah punya akun? <button type="button" class="auth-switch-btn" id="go-to-login">Masuk sekarang</button></p>
      </div>

    </section>
  </main>

  <script src="../supabase-config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
